[package]
name = "tape-decode-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tape-decode"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia-bundle-flac = "0.6"
symphonia-core = "0.6"
tracing = "0.1"
tape-decode = { path = "../tape-decode" }
tape-rf-io = { path = "../tape-rf-io" }
flacenc = { version = "0.4", default-features = false }
